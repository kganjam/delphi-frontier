# Canonical site: morphoswarm.ai / www.morphoswarm.ai -> Delphi Frontier.
# Legacy Studio remains on studio.morphoswarm.ai with its unchanged gated8930
# proxy. Studio cookies are host-only; its existing token gate remains required.
# Source of this October31 redirect change: delphi-frontier repository.
# TLS wildcardcertificate includes morphoswarm.ai and *.morphoswarm.ai.
# Existing agent/Frontier/Orchestra vhosts and protection files are untouched.
# User explicitly requested this redirect after Frontier became ready.

server {
    listen 80;
    listen [::]:80;
    server_name morphoswarm.ai www.morphoswarm.ai;
    access_log /var/log/nginx/morphoswarm.access.log morphoswarm_redacted;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://frontier.morphoswarm.ai$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name morphoswarm.ai www.morphoswarm.ai;
    server_tokens off;
    access_log /var/log/nginx/morphoswarm.access.log morphoswarm_redacted;
    ssl_certificate /etc/ssl/morphoswarm.ai/fullchain.pem;
    ssl_certificate_key /etc/ssl/morphoswarm.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { return 308 https://frontier.morphoswarm.ai$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name *.morphoswarm.ai;
    access_log /var/log/nginx/morphoswarm.access.log morphoswarm_redacted;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.morphoswarm.ai;
    server_tokens off;
    access_log /var/log/nginx/morphoswarm.access.log morphoswarm_redacted;

    ssl_certificate /etc/ssl/morphoswarm.ai/fullchain.pem;
    ssl_certificate_key /etc/ssl/morphoswarm.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:8930;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}

# Other unclaimed subdomains retain their existing apex redirect. Exact-name
# Frontier, Studio and agents vhosts take precedence over this wildcard.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.morphoswarm.ai;
    server_tokens off;
    access_log /var/log/nginx/morphoswarm.access.log morphoswarm_redacted;

    ssl_certificate /etc/ssl/morphoswarm.ai/fullchain.pem;
    ssl_certificate_key /etc/ssl/morphoswarm.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 302 https://morphoswarm.ai$request_uri;
    }
}
