# frontier.morphoswarm.ai -> the Delphi Frontier website/API (user unit delphi-frontier-web, 127.0.0.1:8971).
# NOT INSTALLED by the branch that added it. Install, test and reload are root's (docs/runtime.md). Installed copy would be
# /etc/nginx/conf.d/frontier.morphoswarm.ai.conf.
#
# What this file does NOT do: it changes no global setting, defines no log_format (it reuses the existing `morphoswarm_redacted`, which logs
# $uri and never the query string, from conf.d/00-morphoswarm-log-format.conf; this file must load after it, and `frontier...` sorts after `00-...`),
# does not touch the apex vhost or the `*.morphoswarm.ai` redirect, and does not decide where the apex or studio.morphoswarm.ai point.
# Port 80 for this name is already answered by morphoswarm.ai.conf's catch-all `return 301 https://$host$request_uri`.
#
# Access: the application gates every browser read behind its own session (token from the service's EnvironmentFile) and every write behind an
# operator bearer credential. nginx adds TLS, a per-IP rate backstop and body-size bounds. No token appears in this file.
# TLS: the same wildcard certificate as morphoswarm.ai.conf (morphoswarm.ai, *.morphoswarm.ai).
#
#   Smoke test:  curl -sS https://frontier.morphoswarm.ai/api/health   -> {"mode":"live","service":"delphi-frontier","status":"ok"}
#                curl -sS https://frontier.morphoswarm.ai/api/catalog  -> 401 (sign in first)

limit_req_zone $binary_remote_addr zone=frontier_web:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frontier.morphoswarm.ai;
    server_tokens off;
    access_log /var/log/nginx/frontier.access.log morphoswarm_redacted;

    ssl_certificate /etc/ssl/morphoswarm.ai/fullchain.pem;
    ssl_certificate_key /etc/ssl/morphoswarm.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 3m;     # the store's own bundle cap is 2,000,000 bytes
    limit_req zone=frontier_web burst=60 nodelay;
    limit_req_status 429;

    # Include INSIDE the existing frontier.morphoswarm.ai TLS server block.
    # No new vhost/global configuration, certificate, browser gate or shared token.
    # Existing morphoswarm_redacted format records $uri, never the query/header.
    location = /mcp {
        client_max_body_size 128k;
        access_log /var/log/nginx/frontier-mcp.access.log morphoswarm_redacted;
        proxy_pass http://127.0.0.1:8972/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_send_timeout 65s;
        proxy_read_timeout 65s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /mcp/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8971;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OVERWRITE, not $proxy_add_x_forwarded_for: the adapter keys its sign-in throttle on the last entry, and a client-sent header must not choose it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
