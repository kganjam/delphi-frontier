# Include INSIDE the existing frontier.morphoswarm.ai TLS server block.
# No new vhost/global configuration, certificate, browser gate or shared token.
# Existing morphoswarm_redacted format records $uri, never the query/header.
location = /mcp {
    client_max_body_size 128k;
    access_log /var/log/nginx/frontier-mcp.access.log morphoswarm_redacted;
    proxy_pass http://127.0.0.1:8972/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering on;
    proxy_connect_timeout 5s;
    proxy_send_timeout 65s;
    proxy_read_timeout 65s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /mcp/ {
    return 404;
}
