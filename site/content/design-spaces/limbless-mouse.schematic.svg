<!-- The body of the limbless-mouse schematic: everything inside <svg> except the numbered pins, which the renderer adds from
     the `schematic.pins` list in limbless-mouse.json so that a pin and the list item describing it cannot disagree.
     A drawing, not a measurement and not to scale. The viewBox, title and description live in the JSON beside the pins. -->
<defs>
  <marker id="dsar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e7c86"></path></marker>
  <marker id="dsbar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M8 1 L8 9" stroke="#b3261e" stroke-width="2.6" fill="none"></path></marker>
</defs>
<rect x="0" y="0" width="960" height="440" fill="#fffdf8"></rect>
