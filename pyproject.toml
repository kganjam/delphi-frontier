[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-frontier"
version = "0.1.0"
description = "A bounded, versioned scientific contribution store"
requires-python = ">=3.11"
dependencies = ["psycopg==3.3.4", "pydantic==2.13.4", "mcp==1.27.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
# engineering/geometry (printable forms): the versions every committed artifact in artifacts/print was built with.
# z3-solver runs dx-guilds' solver; openpyxl is needed only by engineering.geometry.daane_s1.
geometry = ["manifold3d==3.5.4", "numpy==2.4.4", "trimesh==5.2.0", "matplotlib==3.11.2", "z3-solver==5.3.3.0",
            "openpyxl==3.1.5"]

[tool.setuptools.package-data]
frontier = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

