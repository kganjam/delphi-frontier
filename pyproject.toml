[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delphi-frontier"
version = "0.1.0"
description = "A bounded, versioned scientific contribution store"
requires-python = ">=3.11"
dependencies = ["psycopg==3.3.4", "pydantic==2.13.4", "mcp==1.27.0"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.package-data]
frontier = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

