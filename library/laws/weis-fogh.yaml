    note: Summary read on journals.biologists.com through an automated summarising fetch, 4 Nov 2026.
  - citation: "Lighthill MJ (1973) On the Weis-Fogh mechanism of lift generation. J Fluid Mech 60:1-17. doi 10.1017/S0022112073000017"
    read_level: search-summary
    note: The 0.69*Omega*c^2 figure comes from abstract text relayed in a web-search summary; the Cambridge page was not opened.
  - citation: "Maxworthy T (1979) Experiments on the Weis-Fogh mechanism of lift generation by insects in hovering flight. Part 1. Dynamics of the 'fling'. J Fluid Mech 93:47-63"
    read_level: search-summary
  - citation: "Crowdy DG (2009) The spreading phase in Lighthill's model of the Weis-Fogh lift mechanism. J Fluid Mech (volume and pages not verified)"
    read_level: search-summary
    note: Used only for the phi = 2*pi/3 condition attached to 0.69.
  - citation: "Lehmann F-O, Sane SP, Dickinson MH (2005) The aerodynamic effects of wing-wing interaction in flapping insect wings. J Exp Biol 208:3075-3092. doi 10.1242/jeb.01744"
    read_level: abstract
    note: Read through an automated summarising fetch (first 100k of ~203k characters); it also relayed a methods Re range of 50-200, wider than the abstract's 100-200.
  - citation: "Lehmann F-O, Pick S (2007) The aerodynamic benefit of wing-wing interaction depends on stroke trajectory in flapping insect wings. J Exp Biol 210(8):1362-1377. doi 10.1242/jeb.02746"
    read_level: abstract
    note: Abstract plus the methods Re (~134), read through an automated summarising fetch (first 100k of ~182k characters).
  - citation: "Miller LA, Peskin CS (2005) A computational fluid dynamics of 'clap and fling' in the smallest insects. J Exp Biol 208(2):195-. doi 10.1242/jeb.01376"
    read_level: abstract
    note: The author-hosted PDF (math.nyu.edu) was outside the session's network allowlist. End page not verified.
  - citation: "Miller LA, Peskin CS (2009) Flexible clap and fling in tiny insect flight. J Exp Biol 212(19):3076-. doi 10.1242/jeb.028662"
    read_level: abstract
    note: Re 10 from the introduction, via summarising fetch. End page not verified.
  - citation: "Santhanakrishnan A, Robinson AK, Jones S, Low AA, Gadi S, Hedrick TL, Miller LA (2014) Clap and fling mechanism with interacting porous wings in tiny insect flight. J Exp Biol 217(21):3898-3909. doi 10.1242/jeb.084897"
    read_level: abstract
    note: Author list carried from the earlier repository entry, which flagged 'Low' vs 'Lowe' as unresolved; not re-checked.
  - citation: "Cheng X, Sun M (2017) Aerodynamic forces and flows of the full and partial clap-fling motions in insects. PeerJ 5:e3002. PMC5346288"
    read_level: full-text
    note: Read from PMC through an automated summarising fetch; absolute coefficients were not reported, only changes relative to a single wing.
  - citation: "Phan HV, Au TKL, Park HC (2016) Clap-and-fling mechanism in a hovering insect-like two-winged flapping-wing micro air vehicle. R Soc Open Sci 3(12):160746. PMC5210694"
    read_level: full-text
    note: Read from PMC through an automated summarising fetch; the first 100k of ~104k characters were processed. Surfaced by the repository's challenge 51 against the earlier version of this entry.
  - citation: "Sun M, Yu X (2006) -- cited by Cheng & Sun 2017 for part of the 20-70 per cent range; title and journal not verified"
    read_level: listing
  - citation: "Dickinson MH, Lehmann F-O, Sane SP (1999) Wing rotation and the aerodynamic basis of insect flight. Science 284:1954-1960. doi 10.1126/science.284.5422.1954"
    read_level: listing
    note: Not read in this session; the three-mechanism statement is carried from the earlier repository entry, which read the abstract.
