    read_level: abstract
    note: "Abstract via Europe PMC (PMID 12878666). The precise exponents 2.97 and 2.08 are not in the abstract; they come from Ribak et al. 2025's citation of this paper. Confidence interval not available to me."
  - citation: "Ribak G, Stearns O, Sundararajan K, Dickerson-Evans D, Melamed D, Rabinovich M, Gurka R (2025) Insect wing flexibility improves the aerodynamic performance of small revolving wings. iScience, doi 10.1016/j.isci.2025.112035, PMC11927721"
    read_level: full-text
    note: "Full-text XML via Europe PMC. Source of the 4.32 +/- 0.64 and 4.38 +/- 0.98 exponents, n = 7 wings, and of the EI ~ F L^3 / beta method."
  - citation: "Puri S, Aegerter-Wilmsen T, Jazwinska A, Aegerter CM (2018) In vivo quantification of mechanical properties of caudal fins in adult zebrafish. J Exp Biol 221(4):jeb171777, doi 10.1242/jeb.171777"
    read_level: abstract
    note: "Abstract via Europe PMC (PMID 29246971). Measurement method details were not read."
  - citation: "Alben S, Madden PGA, Lauder GV (2007) The mechanics of active fin-shape control in ray-finned fishes. J R Soc Interface 4(13):243-256, doi 10.1098/rsif.2006.0181"
    read_level: abstract
    note: "Abstract via Europe PMC (PMID 17251142). The hemitrich two-layer structure is from general knowledge of fin-ray anatomy, not from this abstract; the factor-of-4 bonded/sliding bound is my calculation."
  - citation: "Brazier LG (1927) On the flexure of thin cylindrical shells and other thin sections. Proc R Soc Lond A 116:104-114, doi 10.1098/rspa.1927.0125"
    read_level: abstract
    note: "Abstract via Crossref. No closed-form limit moment was retrieved."
  - citation: "Currey JD, Alexander RMcN (1985) The thickness of the walls of tubular bones. J Zool 206:453-468, doi 10.1111/j.1469-7998.1985.tb03551.x"
    read_level: abstract
    note: "Abstract via Crossref. Numerical optima not retrieved."
  - citation: "Cowper GR (1966) The shear coefficient in Timoshenko's beam theory. J Appl Mech 33:335-340, doi 10.1115/1.3625046"
    read_level: listing
    note: "Bibliographic record confirmed via Crossref only. The circular-section coefficient 6(1+nu)/(7+6nu) used in where_it_breaks (1) is the form usually attributed to this paper; I did not read the paper to confirm it."
  - citation: "Euler-Bernoulli cantilever and Timoshenko shear results (standard textbook mechanics, e.g. Timoshenko & Gere, Mechanics of Materials)"
    read_level: could-not-access
    note: "No textbook was retrieved in this session; the formulae are stated from standard knowledge and the numerical consequences were recomputed here."
  - citation: "This entry's own calculations: shear ratio, elastica shooting (pure-Python RK4 + bisection), equal-mass tube ratios, cantilever mode root, zebrafish k and exponent conversions"
    read_level: full-text
    note: "Calculated, not observed. Script was kept in the session scratchpad and not committed. Check values: elastica delta/L = 0.3017 at F L^2/EI = 1; beta_1 L = 1.87510."
