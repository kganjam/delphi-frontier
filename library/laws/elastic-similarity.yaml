    read_level: full-text
search_scope: >
  Web searches (standard mode, 2026-11-04) for McMahon 1973, McMahon 1975, Alexander et al. 1979,
  Biewener 1989, Niklas 1994/1995, Greenhill 1881. Not searched: insect or bird skeletal scaling,
  sauropod limb scaling, engineered masts. Absence of a failure case from those groups is not
  evidence that the law holds there.
