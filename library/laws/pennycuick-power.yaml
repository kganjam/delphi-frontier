    read_level: full-text
    note: Europe PMC fullTextXML for PMC3730693, read 2026-11-04. Text and tables read; equations are images and were not.
  - citation: "Senior EM, Tickle PG, Walker S, Askew GN (2025) Energetics of free and tethered flight in bumblebees (Bombus terrestris). Biol Lett. doi:10.1098/rsbl.2025.0325"
    read_level: full-text
    note: Europe PMC fullTextXML for PMC12606204, read 2026-11-04.
  - citation: "Tobalske BW, Hedrick TL, Dial KP, Biewener AA (2003) Comparative power curves in bird flight. Nature 421:363-366. doi:10.1038/nature01284"
    read_level: abstract
    note: Abstract via Europe PMC, read 2026-11-04.
  - citation: "von Busse R, Swartz SM, Voigt CC (2013) Flight metabolism in relation to speed in Chiroptera: testing the U-shape paradigm in the short-tailed fruit bat Carollia perspicillata. J Exp Biol 216:2073-2080. doi:10.1242/jeb.081760"
    read_level: abstract
    note: Abstract via Europe PMC, read 2026-11-04.
  - citation: "Dial KP, Biewener AA, Tobalske BW, Warrick DR (1997) Mechanical power output of bird flight. Nature 390:67-70"
    read_level: could-not-access
    note: Characterised only through the Tobalske et al. 2003 abstract. Volume and pages carried over from an earlier session's citation and not re-verified by me.
  - citation: "Ellington CP, Machin KE, Casey TM (1990) Oxygen consumption of bumblebees in forward flight. Nature 347:472-473. doi:10.1038/347472a0"
    read_level: could-not-access
    note: Characterised only through Senior et al. 2025, which cites it as ref 10 with this volume, pages and DOI.
  - citation: "Dudley R, Ellington CP (1990) Mechanics of forward flight in bumblebees II. Quasi-steady lift and power requirements. J Exp Biol 148:53-88"
    read_level: listing
    note: Seen only as a reference-list entry in Senior et al. 2025 (their ref 20, doi:10.1242/jeb.148.1.53). The page range 53-88 is from that listing.
  - citation: "Pennycuick CJ (2008) Modelling the Flying Bird. Academic Press"
    read_level: could-not-access
