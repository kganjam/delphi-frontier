    Crossref metadata only (author list confirmed there). Recorded because the title reports
    a biological structure that USES buckling as a function rather than avoiding it -- a reminder
    that for a design the buckling load can be a target, not only a limit. Its content was not read
    and nothing in this entry rests on it.
