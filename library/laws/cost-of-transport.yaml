    read_level: full-text
  - citation: "Hein AM, Keirsted KJ (2012) The rising cost of warming waters: effects of temperature on the cost of swimming in fishes. Biol Lett 8(2):266-269"
    read_level: full-text
  - citation: "Williams TM (1999) The evolution of cost efficient swimming in marine mammals: limits to energetic optimization. Phil Trans R Soc B 354:193-201"
    read_level: search-summary
  - citation: "Prange HD, Schmidt-Nielsen K (1970) The metabolic cost of swimming in ducks. J Exp Biol 53:763-777"
    read_level: search-summary
  - citation: "Lighton JRB, Weier JA, Feener DH (1993) The energetics of locomotion and load carriage in the desert harvester ant Pogonomyrmex rugosus. J Exp Biol 181:49-62"
    read_level: abstract
  - citation: "Schmidt-Nielsen K (1972) Locomotion: energy cost of swimming, flying, and running. Science 177:222-228"
    read_level: search-summary
