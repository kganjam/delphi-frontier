    read_level: search-summary
    note: "Coefficient 10.7, exponent -0.316 and the 20.1 J/ml O2 conversion are from secondary sources quoting it; the paper was not read."
  - citation: "Schmidt-Nielsen K (1972) Locomotion: energy cost of swimming, flying, and running. Science 177:222-228"
    read_level: search-summary
    note: "Full-text mirror (gwern.net) did not resolve from this session."
  - citation: "Tucker VA (1970) Energetic cost of locomotion in animals. Comp. Biochem. Physiol. 34:841-846"
    read_level: listing
