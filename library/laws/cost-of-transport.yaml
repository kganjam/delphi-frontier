    read_level: abstract
    note: "Full text (cob.silverchair.com) did not resolve from this session."
  - citation: "Nudds RL, Codd JR, Sellers WI (2009) Evidence for a mass dependent step-change in the scaling of efficiency in terrestrial locomotion. PLoS ONE 4(9):e6927, doi:10.1371/journal.pone.0006927"
    read_level: full-text
    note: "Read via a tool that summarises the page; the step-change exponents and the 7%/26% efficiencies were quoted from it."
  - citation: "Bale R, Hao M, Bhalla APS, Patankar NA (2014) Energy efficiency and allometry of movement of swimming and flying animals. PNAS 111(21):7517-7521, doi:10.1073/pnas.1310544111"
    read_level: full-text
    note: "Read via a summarising tool; Table 1 was reported garbled in the extracted text, so the regression coefficients carry that risk."
  - citation: "Bejan A, Marden JH (2006) Unifying constructal theory for scale effects in running, swimming and flying. J. Exp. Biol. 209:238-248, doi:10.1242/jeb.01974"
    read_level: search-summary
