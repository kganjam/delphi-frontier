    read_level: search-summary
  - citation: "Fish FE, Baudinette RV (1999), title, journal and pages not confirmed"
    read_level: search-summary
    note: "Only the finding (swimming metabolic rate rising with speed in the pattern of surface wave drag) was seen, in a search summary."
  - citation: "Dawson TJ, Taylor CR (1973) Energetic cost of locomotion in kangaroos. Nature 246:313-314"
    read_level: search-summary
  - citation: "Thompson SD et al. (1980) Nature 287:223, full author list and title not confirmed"
    read_level: search-summary
    note: "Located only as a nature.com link (287223a0) and a search summary of its finding; not read."
  - citation: "Videler JJ (1993) Fish Swimming. Chapman & Hall"
    read_level: listing
  - citation: "Full RJ (1989) Mechanics and energetics of terrestrial locomotion: bipeds to polypeds. In Energy Transformations in Cells and Organisms"
    read_level: search-summary
    note: "Known only as cited by Nudds et al. (2009)."
