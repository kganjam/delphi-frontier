    read_level: full-text
    note: Read through a fetch tool that summarises the page. The quotations above came back verbatim.
  - citation: "Full RJ, Tu MS (1991) Mechanics of a rapid running insect: two-, four- and six-legged locomotion. J Exp Biol 156:215-231"
    read_level: listing
    note: Its COT result is known only as reported by Rose et al. 2015.
  - citation: "Hein AM, Keirsted KJ (2012) The rising cost of warming waters: effects of temperature on the cost of swimming in fishes. Biol Lett 8(2):266-269 (PMC3297402)"
    read_level: full-text
    note: Read through a fetch tool that summarises the page. Equation images not readable.
