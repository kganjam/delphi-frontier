  - citation: "Pelster B, Burggren WW (1996) Disruption of hemoglobin oxygen transport does not impact oxygen-dependent physiological processes in developing embryos of zebra fish (Danio rerio). Circ Res 79(2):358-362. doi:10.1161/01.res.79.2.358"
    read_level: search-summary
