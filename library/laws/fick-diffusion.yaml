    read_level: search-summary
    note: Searched for larval MO2 values; none obtained. Hence q_zebrafish_tissue = unknown.
  - citation: "Volland J-M et al. (2022) A centimeter-long bacterium with DNA contained in metabolically active, membrane-bound organelles. Science 376(6600):1453-1458. doi:10.1126/science.abb3634"
    read_level: search-summary
    note: Anatomy figures (cytoplasm 1.8-4.8 um; vacuole 65-80%) taken from Wikipedia/NHM summaries, not from the paper.
  - citation: "Krogh A (1919) The number and distribution of capillaries in muscles with calculations of the oxygen pressure head necessary for supplying the tissue. J Physiol 52:409-415"
    read_level: could-not-access
    note: The annular solution in where_it_breaks is my own derivation, not checked against Krogh's text.
search_scope: >
  Six web searches and four fetch attempts on 2026-11-04. pubmed.ncbi.nlm.nih.gov and
  cob.silverchair.com (J Exp Biol) did not resolve from this session's network; zfin.org returned
  HTTP 503. No full text was read for any source. Negative findings above (zebrafish q, zebrafish
  tissue D, 37 C medium O2) are bounded by these searches only.
