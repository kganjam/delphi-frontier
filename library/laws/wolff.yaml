negative_search_scope: >
  Searches in this session were 20 web searches, each relayed through a search-summary tool, plus
  abstract and listing pages that surfaced in their results. No full text was read for any source. Where
  this entry says a value was "not found", the search was limited to that scope. That includes Huiskes'
  lazy-zone width, Frost's MESr, and the Rubin & Lanyon 2000-3500 microstrain range. It does not mean the
  value is absent from the literature.
