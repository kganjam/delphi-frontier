id: wolff
name: "Wolff's law of bone remodelling (bone adapts its mass and architecture to the loads it carries)"
usability: descriptive           # no transferable constant: every numerical form needs its reference stimulus fitted to the same site it then "predicts" (see where_it_breaks)
# Wolff (1892) stated no equation that a design can be checked against. The equation below is NOT
# Wolff's. It is the strain-energy-density (SED) feedback rule of the Huiskes / Weinans school
# (Huiskes et al. 1987; Weinans et al. 1992), which is the most widely used computable form of the law.
# The lazy-zone form in `latex` is written as secondary sources describe it; the exact parameterisation
# printed in Huiskes et al. (1987) was NOT read in this session (abstract-level only).
# The checker cannot parse subtraction, so the equation is written over the excess stimulus S_excess,
# which is defined in `symbols` and spelled out in `latex`.
equation: "drho_dt = B * S_excess"
stimulus_definition: "S = U / rho ; S_excess = S - (1 + s) * k above the lazy zone, 0 inside it, S - (1 - s) * k below it"
latex: "\\frac{d\\rho}{dt} = B\\,S_{\\mathrm{exc}}, \\quad S_{\\mathrm{exc}} = \\begin{cases} S-(1+s)k & S>(1+s)k \\\\ 0 & (1-s)k \\le S \\le (1+s)k \\\\ S-(1-s)k & S<(1-s)k \\end{cases}, \\quad S = \\frac{U}{\\rho}"
symbols:
  drho_dt:  {dimension: M/(L^3*T), units: kg/(m^3*s), description: "rate of change of apparent bone density at a point"}
  B:        {dimension: M*T/L^5,   units: kg*s/m^5,   description: "remodelling rate coefficient; fitted, not measured (see constants)"}
  S_excess: {dimension: L^2/T^2,   units: J/kg,       description: "stimulus in excess of the lazy-zone bound; zero inside the lazy zone"}
  S:        {dimension: L^2/T^2,   units: J/kg,       description: "mechanical stimulus: strain energy density per unit bone mass (U / rho)"}
  U:        {dimension: M/(L*T^2), units: J/m^3,      description: "strain energy density from a finite-element or strain-gauge estimate"}
  rho:      {dimension: M/L^3,     units: kg/m^3,     description: apparent density of the bone at that point}
  k:        {dimension: L^2/T^2,   units: J/kg,       description: "reference (homeostatic) stimulus; site-specific"}
  s:        {dimension: "1",       units: dimensionless, description: "half-width of the lazy zone as a fraction of k"}
constants:
  reference_stimulus_k:
    value: unknown
    units: J/kg
    note: >
      No universal value exists. In the Huiskes-type rule k is the "reference SED at the same location"
      (secondary-source description, search-summary): it is set from the intact, pre-intervention bone
      at that site. The model therefore fixes its reference to the state whose change it then predicts.
      A 2019 study in a different SED model (Sci Rep, doi 10.1038/s41598-019-51429-w, search-summary)
      used reference values of 0.002 to 0.014 J/g and found the converged mean density depends on that
      choice. That range belongs to that model and is NOT a measured constant of bone.
  lazy_zone_half_width_s:
    value: unknown
    units: dimensionless
    note: >
      Searched for the value used by Huiskes et al. (1987) and Weinans et al. (1992); not found in any
      abstract or summary read in this session. The same 2019 study (search-summary) reports the
      equilibrium-zone width did not much change the converged mean density. Not invented here.
  rate_coefficient_B:
    value: unknown
    units: kg*s/m^5
    note: Fitted per simulation. Not a measured property of bone; no value was found in this session.
  minimum_effective_strain_modelling_MESm:
    value: "1000-1500 microstrain (Andrews review) vs about 800-1500 microstrain (Wikipedia 'Mechanostat') -- not reconciled"
    interval: unknown
    units: dimensionless (strain)
    note: >
      ASSERTED, NOT MEASURED. This is Frost's mechanostat threshold (Frost 2003 update, not read). Both
      ranges reached us through secondary sources at search-summary level, and they disagree on the lower
      bound. Neither comes with a measurement interval, so `interval` is unknown. The threshold is a
      postulate of the hypothesis. We found no single experiment that measures it as a material constant
      (scope: the searches listed under sources only).
  minimum_effective_strain_remodelling_MESr:
    value: unknown
    units: dimensionless (strain)
    note: >
      Frost's lower (disuse) threshold. Searched for a value; the summaries we read define MESr but give
      no number. Left as unknown rather than quoted from memory.
  peak_functional_strain_vertebrates:
    value: -2.5e-3
    interval: [-5.2e-3, -1.7e-3]
    units: dimensionless (principal compressive strain)
    note: >
      MEASURED (in vivo strain gauges), but relayed second-hand. A search summary attributes "-1700 to
      -5200 microstrain, averaging -2500" at cortical sites of various mammals and birds during strenuous
      activity to a later review whose identity we did not recover. The often-quoted 2000-3500
      microstrain from Rubin & Lanyon (1984, J Theor Biol) could NOT be verified: the abstract summary we
      reached did not contain it. A UCL paper (search-summary) disputes that strain similarity explains
      the spread of safety factors across tetrapods. Recorded, not reconciled.
  daily_cycles_turkey_ulna:
    value: "4 cycles/day: no net change; 36 cycles/day at 0.5 Hz: periosteal and endosteal formation"
    interval: unknown
    units: cycles/day
    note: >
      MEASURED, Rubin & Lanyon (1984, JBJS 66A), abstract level. This is the functionally isolated turkey
      ulna, so the baseline it is compared with is DISUSE resorption, not normal use. The authors warn the
      result depends on the non-physiological load distribution they imposed.
  static_load_effect_turkey_ulna:
    value: "no measurable effect"
    interval: unknown
    units: dimensionless
    note: >
      MEASURED, Lanyon & Rubin (1984, J Biomech 17), abstract/index level. Static load at strains in the
      normal functional range had no measurable effect on remodelling. A similar intermittent load (525 N
      as relayed) applied for 100 s/day was associated with a 24% increase in cross-sectional area,
      mostly new periosteal bone.
mechanism: >
  The author's claim, Wolff (1892, as translated by Maquet & Furlong 1986; read at listing level only): bone
  architecture follows mathematical rules set by mechanical stress, with trabeculae lying along the
  principal stress trajectories. Wolff's version was a geometric claim about growth and form. A Springer
  chapter (search-summary) notes that the translators rendered "Transformation" as "remodelling", although
  Wolff was writing about growth and what is now called modelling. The modern MECHANISTIC reading
  is separate from Wolff's text and is a hypothesis. Osteocytes in the matrix sense dynamic strain or the
  fluid flow it drives, and they signal osteoblasts to form bone where the stimulus is above a set point
  and osteoclasts to remove it where the stimulus is below. The SED rule above encodes exactly that
  negative feedback, with a dead band (the lazy zone). What has actually been MEASURED is narrower than
  the mechanism. Bone mass in vivo rises under added DYNAMIC load: the turkey ulna, tennis players'
  playing arms and exercised adult zebrafish vertebrae. It falls under disuse, as in spaceflight. The
  feedback set point, the sensor cell, and the claim that architecture follows stress trajectories are
  ASSERTED or inferred, not measured.
measured_vs_asserted:
  measured:
    - "Added dynamic (not static) load increases bone mass and cross-section in vivo (turkey ulna: Lanyon & Rubin 1984; Rubin & Lanyon 1984)."
    - "Habitual unilateral loading is associated with side-to-side cortical differences in humans (Jones et al. 1977; cross-sectional observational, not an intervention)."
    - "Unloading in spaceflight removes bone at measured monthly rates (Lang et al. 2004)."
    - "Four weeks of forced swimming increases vertebral bone formation in adult zebrafish (Suniaga et al. 2018)."
    - "Bone without osteocytes (tilapia operculum) still responds to controlled loading (Atkins et al. 2015, as relayed)."
  asserted_or_modelled:
    - "That trabeculae follow, and cross orthogonally along, principal stress trajectories (Wolff 1892) -- disputed (Cowin 1997)."
    - "That a single homeostatic set point (MESm, MESr, or SED reference k) exists and is a property of the tissue (Frost; Huiskes et al.)."
    - "That osteocytes are THE mechanosensor -- contradicted in its necessity by anosteocytic bone that still adapts."
    - "That cross-sectional geometry records the direction of habitual loading -- tested and found unreliable (Demes et al. 2001; Lieberman et al. 2004)."
    - "Every density distribution produced by an SED finite-element rule. These are SIMULATIONS and non-unique (Weinans et al. 1992)."
domain_of_validity:
  loading: "dynamic (cyclic) loading; static loading is outside it (see where_it_breaks)"
  tissue: "cellular (osteocytic) bone in mammals and birds; partial evidence in teleosts, including anosteocytic bone"
  taxa_with_in_vivo_evidence:
    - "Meleagris gallopavo (turkey), functionally isolated ulna -- Lanyon & Rubin 1984; Rubin & Lanyon 1984"
    - "Homo sapiens, humerus of professional tennis players -- Jones et al. 1977; spine and hip in ISS crew -- Lang et al. 2004"
    - "Danio rerio, adult vertebrae under swim-tunnel exercise -- Suniaga et al. 2018"
    - "Oreochromis (tilapia), anosteocytic operculum under controlled loading -- Atkins et al. 2015 (search-summary)"
    - "Salmon vertebrae -- PMC3196754 (search-summary; authors not recovered)"
  life_stage: "strongest before sexual maturity (Pearson & Lieberman 2004, abstract level)"
  notes: >
    The law is reliable as a qualitative statement: under added dynamic load, bone mass at the loaded
    site rises, and under unloading it falls. The size of the response is specific to species, site
    and age. No source we read gives a transferable gain, threshold or time constant.
where_it_breaks: >
  (1) STATIC LOAD -- no response. Lanyon & Rubin (1984), abstract level: static load at normal functional
  strain had no measurable effect on remodelling of the isolated turkey ulna, while a similar
  intermittent load for 100 s/day added 24% cross-sectional area. Any formulation driven by strain or SED
  MAGNITUDE alone, including the SED rule in `equation` as written, predicts the same response for both
  and is therefore wrong here. The SED rule needs a load history averaged over cycles to avoid this. That
  diagnosis is our inference; it is not quoted from the paper.
  (2) TRABECULAR "TRAJECTORIES" -- Wolff's own mathematical claim. Cowin (1997, listing level) calls the
  comparison between stress trajectories in a homogeneous isotropic elastic body and trabecular
  architecture a "false premise". Secondary sources (search-summary) report non-orthogonal trabecular
  crossing near many joints, including the proximal femur. They also report that multiple-load analyses
  predict orientations that match the principal directions of NO single load case. So the exact
  orthogonal-trajectory form of the law fails, even where the qualitative mass response holds.
  (3) READING LOAD BACKWARDS FROM CROSS-SECTION -- the inference an engineer or palaeontologist most wants,
  and the one that is measured to fail. Lieberman, Polk & Demes (2004, abstract level), sheep tibia and
  metatarsal with rosette gauges: centroid-based section properties differ by up to 55% in magnitude from
  properties about the measured neutral axis. Cross-sectional properties "do not necessarily provide
  reliable data on the orientations of loads". Demes et al. (2001, macaque tibia, abstract level): the
  bending axis does not coincide with the section's maximum principal axis, so the geometry does not
  minimise strain or tissue. Demes et al. (1998, macaque ulna, abstract level): predominant bending is
  mediolateral, yet the ulna is not reinforced in that plane.
  (4) ADULTS -- reduced response. Pearson & Lieberman (2004, abstract level): cortical bone is primarily
  responsive to strain before sexual maturity, in both modelling and Haversian remodelling rates. The
  authors state Wolff's law "is not always true" and is several processes best treated separately. Do
  not apply a response gain measured in juveniles to adults.
  (5) LOW-STRAIN SKELETAL REGIONS -- bone persists where the stimulus is low. Hylander, Ravosa and
  colleagues (search-summary) report low strains in the primate cranial vault and upper face during
  feeding. They argue that bone mass there is set by growth, calcium metabolism or spatial packing rather
  than by chewing loads. Taken at face value, a homeostatic set-point model would resorb that bone.
  Contested (see contested_by).
  (6) THE SIMULATION ITSELF -- non-unique and discontinuous. Weinans, Huiskes & Grootenboer (1992,
  abstract level): the SED rule converges to a "discontinuous patchwork". It behaves as a nonlinear
  dynamical system that diverges relative to its objective, leading to "many possible solutions" that
  depend on the rule parameters, the load and the initial conditions. A density map from this rule is a
  SIMULATED result, not an observation, and its resemblance to a real femur is a visual comparison, not
  a validation.
  (7) TAXON -- the mechanism breaks before the phenomenon does. Most neoteleost fish have acellular
  (anosteocytic) bone. Atkins et al. (2015, search-summary) report that the tilapia operculum adapts to
  applied load with both resorption and deposition despite having no osteocytes, and propose osteoblasts
  as the sensor. Any design rule that relies on osteocyte density or osteocyte signalling therefore does
  not transfer to these fish. The adaptation itself does appear to transfer, on that one study. An
  Oxford review (search-summary; authors not recovered) argues that teleost osteocytes serve mineral
  homeostasis, not strain sensing.
  (8) EXTRAPOLATION IN TIME. Lang et al. (2004), abstract level, caution that their 4- to 6-month
  spaceflight loss rates should not be used to predict much longer missions. Linear projection of any
  measured rate beyond the measured duration is outside the evidence.
worked_examples:
  - organism: Homo sapiens, professional tennis players (playing vs non-playing humerus)
    value: "cortical thickness +34.9% (men), +28.4% (women), playing side vs control side"
    note: >
      OBSERVATION (radiographs, Jones et al. 1977, as relayed at search-summary level). It is
      cross-sectional, so it cannot separate an adaptive response from a selection effect or a
      growth-period effect. Haapasalo et al. (1996, search-summary) report side-to-side differences of about
      6.9% to 45.2%, larger in players who started young, which is consistent with breaking point (4).
    evidence: literature
  - organism: Homo sapiens, ISS crew (14 crewmembers, 4- to 6-month flights)
    value: "hip trabecular vBMD loss 2.2-2.7 %/month (measured); 6-month projection 13.2-16.2 % (calculated)"
    computation: "6 months * 2.2 %/month = 13.2 % ; 6 months * 2.7 %/month = 16.2 % (linear, no compounding)"
    note: >
      The monthly rates are MEASURED (QCT, Lang et al. 2004 abstract). Over the same flights, hip
      cortical vBMD fell 0.4-0.5 %/month and spine aBMD 0.9 %/month. The 6-month figure is our
      CALCULATION, a linear multiplication within the measured flight duration, not a reported value. A
      2004 UCSF press summary gives hip cortical loss of 1.6-1.7 %/month, which disagrees with the
      paper's abstract (0.4-0.5 %/month). We use the abstract and record the discrepancy.
    evidence: derived
  - organism: Meleagris gallopavo, functionally isolated ulna
    value: "static load: no measurable effect; 100 s/day intermittent load: +24% cross-sectional area"
    note: >
      OBSERVATION (Lanyon & Rubin 1984, abstract/index level). This is the cleanest demonstration of
      breaking point (1).
    evidence: literature
  - organism: Danio rerio, adult, 4 weeks forced swimming
    value: "increased osteoblast number, vertebral bone volume, mineralisation and bone formation rate; mineral apposition rate not significantly different"
    note: >
      OBSERVATION (Suniaga et al. 2018, search-summary of the paper and its ZFIN figure records). No
      effect sizes were extracted in this session, so none are given. Zebrafish bone is osteocytic
      (cellular); that is background knowledge, not taken from this source. So this case does not test
      breaking point (7).
    evidence: literature
  - organism: Homo sapiens, femur around a total-hip stem (finite-element model)
    value: "predicted periprosthetic resorption increases with stem rigidity and depends on bonding"
    note: >
      SIMULATED, not observed (Huiskes et al. 1987, abstract level). The model applies the SED rule in
      `equation` with k set from the intact femur. The output is a model prediction; whether it matched
      clinical radiographs was not checked in this session.
    evidence: derived
contested_by:
  - "Bertram & Swartz (1991), 'The law of bone transformation: a case of crying Wolff?' -- a critique by title; its arguments were NOT read (bibliographic listing only) and are not summarised here."
  - "Cowin (1997): the trajectorial (Wolff's mathematical) form rests on a false premise. Ruff, Holt & Trinkaus (2006, AJPA 129:484-498; citation from memory, search did not reach it) are generally cited as defending bone functional adaptation for inferring behaviour from skeletons. Their arguments were not read."
  - "Lieberman, Polk & Demes (2004) and Demes et al. (2001): cross-sectional geometry does not reliably give loading direction. This stands against the routine palaeoanthropological use of section properties as a record of behaviour."
  - "Cranial bone: Hylander, Ravosa and colleagues hold that low-strain cranial bone is not maintained by feeding loads. Dechow, Wang & Peterson (2011; search-summary) report that functional forces appear important for maintaining bone mass across the craniofacial skeleton, including low-strain browridges. Their evidence is on material properties in dentate vs edentulous individuals, not on strain-driven remodelling directly. Not reconciled."
  - "Teleost sensor: Atkins et al. (2015) hold that anosteocytic bone adapts, with osteoblasts as the likely sensor. An Oxford review holds that teleost osteocytes serve mineral homeostasis rather than strain detection. Not reconciled."
  - "Strain similarity: Rubin & Lanyon (1984, J Theor Biol) propose that vertebrates hold peak functional strain similar across body size. A later UCL paper (search-summary) argues this does not explain the diversity of safety factors across taxa, ontogeny and function."
