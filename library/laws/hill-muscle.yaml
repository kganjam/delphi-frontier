id: hill-muscle
name: Hill force-velocity relation for muscle, and its measured parameters
usability: constraining          # bounds steady-state shortening speed and power at a given load, ONLY inside 0.05-0.8 F0 and ONLY for steady isotonic shortening (see where_it_breaks)
# The equation is written in EXPANDED form because that is the form the dimension gate can check. The
# gate splits a side on '+' and keeps the first term, and it does not tokenise '-', so the canonical
# factored form (F + a)(v + b) = (F0 + a) b would be "checked" on a single fragment and pass vacuously.
# Expanded, the a*b term cancels and every surviving term is a product. The gate tests the first term on
# each side (F*v against b*F0, which forces b to be a velocity); the remaining terms a*v and b*F were
# checked by hand (a is a force, b a velocity, so both are force*velocity). The factored form is in `latex`.
equation: "F * v + a * v + b * F = b * F0"
canonical_form: "(F + a) * (v + b) = (F0 + a) * b"
normalised_form: "v / v_max = (1 - F/F0) / (1 + (F/F0) / G),  with G = a/F0 = b/v_max"
latex: "(F + a)(v + b) = (F_0 + a)\\,b \\quad\\Longleftrightarrow\\quad \\frac{v}{v_{\\max}} = \\frac{1 - F/F_0}{1 + (F/F_0)/G},\\; G = \\frac{a}{F_0} = \\frac{b}{v_{\\max}}"
symbols:
  F:     {dimension: M*L/T^2, units: N, description: "force (load) during steady isotonic shortening"}
  v:     {dimension: L/T,     units: m/s, description: "steady shortening velocity (in practice reported in muscle or fibre lengths per second, L0/s)"}
  F0:    {dimension: M*L/T^2, units: N, description: "maximum isometric force at the same length and activation"}
  a:     {dimension: M*L/T^2, units: N, description: "Hill force constant; a FITTED parameter, not a measured quantity"}
  b:     {dimension: L/T,     units: m/s, description: "Hill velocity constant; a FITTED parameter, b = a*v_max/F0"}
  v_max: {dimension: L/T,     units: m/s, description: "unloaded shortening velocity extrapolated from the fitted hyperbola (not the same as slack-test V0)"}
  G:     {dimension: "1",     units: dimensionless, description: "curvature constant a/F0 = b/v_max; SMALLER G means a MORE curved relation"}
constants:
  curvature_G_universal:
    value: unknown
    interval: [0.066, 0.49]
    units: dimensionless
    note: >
      There is no single measured value of a/F0. The interval is OUR assembly of the extreme means found
      in the sources read for this entry (rat type 1 and 2A skinned fibres at 12 C, 0.066, Bottinelli et
      al. 1991; carp red muscle at 10 C, 0.49, Rome & Sosnicki 1990). It mixes species, fibre types,
      temperatures and preparations, and is a span of reported means, not a confidence interval. A value
      of 0.25 is often quoted in teaching material; it was NOT found in any source read here, so it is not
      entered. Hill (1938) full text was not read.
  # Bottinelli, Schiaffino & Reggiani (1991), abstract: 74 skinned single fibres from rat soleus, EDL and
  # plantaris at 12 C, typed by myosin heavy chain. Fitted to observed force-velocity points. Skinned fibres
  # at 12 C, not intact muscle at body temperature. Intervals are mean +- 1 SEM (our construction).
  curvature_G_rat_type1_12C:  {value: 0.066, interval: [0.059, 0.073], units: dimensionless, note: "Bottinelli et al. 1991; 0.066 +- 0.007 (SEM)"}
  curvature_G_rat_type2A_12C: {value: 0.066, interval: [0.042, 0.090], units: dimensionless, note: "Bottinelli et al. 1991; 0.066 +- 0.024 (SEM)"}
  curvature_G_rat_type2X_12C: {value: 0.132, interval: [0.124, 0.140], units: dimensionless, note: "Bottinelli et al. 1991; 0.132 +- 0.008 (SEM)"}
  curvature_G_rat_type2B_12C: {value: 0.113, interval: [0.100, 0.126], units: dimensionless, note: "Bottinelli et al. 1991; 0.113 +- 0.013 (SEM)"}
  v0_rat_type1_12C:  {value: 0.639, interval: [0.601, 0.677], units: L0/s, note: "Bottinelli et al. 1991; 0.639 +- 0.038 (SEM); observed range 0.35-0.95 L0/s. Slack-test V0, not Hill v_max"}
  v0_rat_type2A_12C: {value: 1.396, interval: [1.312, 1.480], units: L0/s, note: "Bottinelli et al. 1991; 1.396 +- 0.084 (SEM)"}
  v0_rat_type2X_12C: {value: 1.451, interval: [1.385, 1.517], units: L0/s, note: "Bottinelli et al. 1991; 1.451 +- 0.066 (SEM)"}
  v0_rat_type2B_12C: {value: 1.800, interval: [1.691, 1.909], units: L0/s, note: "Bottinelli et al. 1991; 1.800 +- 0.109 (SEM). All type 2 fibres had V0 above 0.91 L0/s and fast-type ranges mostly overlapped"}
  # Rome & Sosnicki (1990), abstract: carp red-muscle bundles of about 100 fibres, force clamp, n = 6 per
  # temperature. Intervals are mean +- 1 SEM (our construction).
  curvature_G_carp_red_10C: {value: 0.49, interval: [0.43, 0.55], units: dimensionless, note: "0.49 +- 0.06 (SEM)"}
  curvature_G_carp_red_20C: {value: 0.29, interval: [0.23, 0.35], units: dimensionless, note: "0.29 +- 0.06 (SEM); curvature INCREASES (G falls) with temperature in this preparation"}
  v_max_carp_red_10C: {value: 3.55, interval: [3.29, 3.81], units: L0/s, note: "3.55 +- 0.26 (SEM)"}
  v_max_carp_red_20C:
    value: 5.71
    interval: [5.42, 6.00]
    units: L0/s
    note: >
      5.71 +- 0.29 (SEM). Same abstract: Q10 of v_max 1.63 +- 0.07; Q10 of isometric tension 1.13 +- 0.02;
      maximal power 59.7 +- 2.3 W/kg (10 C) and 94.3 +- 3.2 W/kg (20 C), Q10 1.58.
  high_force_breakpoint_frog:
    value: 0.784
    interval: [0.780, 0.788]
    units: F/F0
    note: >
      Edman (1988), abstract: 78.4 +- 0.4 % of F0 (mean +- SEM, n = 12), corresponding to 10.9 +- 0.4 % of
      v_max, Rana temporaria anterior tibialis single fibres, 1-3 C, sarcomere length 2.10 um. The interval
      is mean +- 1 SEM (our construction from the reported SEM). Other preparations put the break higher:
      0.88 F0 in rat medial gastrocnemius in situ (Devrome & MacIntosh 2007, as reported by Alcazar et al.
      2019; primary not read) and 0.90 F0 falling to 0.80 F0 after fatigue (Devrome & MacIntosh 2018, as
      reported by Alcazar et al. 2019; primary not read).
  curvature_G_zebrafish:
    value: unknown
    interval: unknown
    units: dimensionless
    note: >
      No force-velocity parameters (a/F0, v_max) for Danio rerio muscle were found. Scope of the negative:
      one web search ("fish muscle force-velocity Hill curvature Vmax temperature carp scup ... zebrafish
      muscle fibres Vmax a/P0", Nov 2026), which returned carp, icefish, cod and marlin work and no zebrafish
      data. No zebrafish-specific search beyond that one was run; not filled from memory or from another
      teleost.
mechanism: >
  Hill (1938) fitted a rectangular hyperbola to the steady shortening speed of frog sartorius at each
  afterload and originally identified the force constant a with the coefficient of the heat of shortening
  (title and listing level for the 1938 paper; its content as reported by Hill 1964 and secondary
  sources). Hill (1964) himself withdrew that identification: the heat coefficient depends on load
  (alpha/F0 = 0.16 + 0.18 F/F0 for frog sartorius at 0 C, as given in the abstract) and the 1938 agreement
  was probably a measurement error making alpha about 30 % too great. Since then the relation has been
  treated as an empirical description (Abbott & Wilkie 1953, as reported by Seow 2013). The cross-bridge
  reading (Huxley 1957, as summarised by Seow 2013; Huxley not read) is that speed falls with load because
  a load lengthens the time each attached bridge must bear strain before it detaches, so fewer bridges
  are cycling quickly; Seow (2013) shows that a two-state model gives the Hill form under three
  assumptions that are only approximately true, and argues the curvature carries molecular information.
  The hyperbola's shape makes power F*v peak at an intermediate load: maximising f(1-f)/(1+f/G) gives
  f_opt = v_opt/v_max = sqrt(G^2 + G) - G (derived here, not taken from a source), about 0.3 for G
  near 0.25, consistent with Seow's statement that maximum power occurs at about 0.3 F0.
domain_of_validity:
  regime: steady-state isotonic (or isovelocity) SHORTENING under full, constant activation
  force_range: "about 0.05 to 0.8 F0 (Seow 2013: velocities in this range 'remarkably close' to Hill predictions)"
  taxa: [frog, "mammalian skeletal muscle (rat, cat, human)", "teleost myotomal muscle (carp, icefish, cod, marlin)"]
  parameter_scope: "a, b and v_max belong to one preparation at one temperature, length and activation; they are refitted, not predicted"
  notes: >
    Edman (1988) reports that changing sarcomere length from 1.85 to 2.60 um left v_max unchanged but
    progressively reduced curvature, so G is also length-dependent. The law says nothing about force at
    rest length versus other lengths (that is the separate force-length relation).
where_it_breaks: >
  (1) HIGH FORCE, ABOVE ABOUT 0.78-0.90 F0 -- measured. Edman (1988) found the frog-fibre relation is
  double-hyperbolic, with a break at 78.4 +- 0.4 % F0 (10.9 % v_max) and stronger curvature above it.
  The break is reported at 0.88 F0 in rat muscle in situ and 0.80-0.90 F0 depending on fatigue (Devrome &
  MacIntosh 2007, 2018, as reported by Alcazar et al. 2019). Consequence, as reported by Alcazar et al.:
  a hyperbola fitted to low and middle loads OVERESTIMATES measured isometric force, by 17 % (Edman
  1988a), 32 % (Edman 1976, truncated fit) and 13 % (Alcazar 2018b). In carp red muscle the extrapolated
  zero-velocity load was 1.19 (10 C) and 1.51 (20 C) (Rome & Sosnicki 1990, abstract; our reading is that
  these are multiples of measured F0, which the abstract text seen did not state). Our inference: F0 taken
  from a Hill fit must not be used as a holding-force capacity.
  (2) VERY LOW FORCE, BELOW ABOUT 0.05 F0 -- measured. Single fibres shorten faster than the hyperbola
  predicts; the Hill v_max underestimates slack-test V0 by about 6-7 % (Edman et al. 1976; Julian et al.
  1986, both as reported by Seow 2013).
  (3) LENGTHENING (F > F0) -- the hyperbola does not continue. Katz (1939) noted lengthening speeds smaller
  than the hyperbola predicts (as reported by Alcazar et al. 2019; Katz read at listing level only). The
  isolated-animal-muscle eccentric plateau is about 1.6-1.8 F0 (Edman 1988 delineated the negative branch
  to 1.6-1.8 F0; Alcazar et al. 2019 summary of animal work), whereas human in vivo eccentric values span
  5 % BELOW to 80 % above isometric (Alcazar et al. 2019 compilation, see contested_by). Between 0.90 and
  1.20 F0 frog-fibre speed changed by only 1.8 +- 0.3 % of v_max (Edman 1988).
  (4) NON-STEADY STATE AND HISTORY -- the law holds no memory. After active shortening, isometric force is
  depressed; after active stretch, it is enhanced (Abbott & Aubert 1952, as described in later reviews;
  primary read at listing level only). A muscle model that maps instantaneous velocity to force by the Hill
  relation alone cannot reproduce this.
  (5) CYCLIC CONTRACTION, WHICH IS HOW LOCOMOTOR MUSCLE ACTUALLY WORKS -- measured. In work-loop
  experiments (method: Josephson 1985), Askew & Marsh (1998, search-summary level) found the optimal V/v_max
  for power ranged about fourfold, 0.075 to 0.30, and lay BELOW the optimum predicted from the
  force-velocity curve, attributed to finite activation and deactivation kinetics and strain. Our
  inference: a swimming- or flight-power budget computed from Hill Pmax is an upper bound, not an
  estimate, and can overstate cyclic power at the cycle frequencies an animal uses.
  (6) MULTI-JOINT HUMAN TASKS -- the measured relation is often closer to LINEAR than hyperbolic (Alcazar
  et al. 2019 review; e.g. Cuevas-Aburto et al. 2018 bench press, linear vs hyperbolic R^2 0.997 vs 1.000
  in one subject). Whole-limb force-velocity mixes several muscles, lever arms and activation limits; it is
  not the Hill relation of any one muscle.
  (7) PARAMETERS DO NOT TRANSFER ACROSS TEMPERATURE OR FIBRE TYPE. G spans at least 0.066 to 0.49 in the
  sources read, and the direction of its temperature dependence differs between sources (contested_by).
  v_max in carp red muscle rose 61 % from 10 C to 20 C (Rome & Sosnicki 1990). No zebrafish values were
  found (scope in constants.curvature_G_zebrafish).
worked_examples:
  - organism: any muscle with a fitted curvature G (no taxon)
    computation: "maximise P/(F0*v_max) = f*(1-f)/(1+f/G)  ->  f_opt = sqrt(G^2+G) - G = v_opt/v_max;  G = 0.25 -> f_opt = 0.309, P_max = 0.0955*F0*v_max;  G = 0.066 -> 0.199, 0.0397;  G = 0.49 -> 0.364, 0.1328"
    value: 0.309
    value_range: [0.199, 0.364]
    note: >
      DERIVED from the equation, not observed. G = 0.25 is an illustrative value, not a measurement. Over
      the span of G found in the sources (0.066-0.49) the predicted peak-power load moves from 0.20 to
      0.36 F0 and the dimensionless peak power changes 3.3-fold, so a power check is only as good as the
      measured G for the actual muscle and temperature. Note that f_opt equals v_opt/v_max for every G
      (a property of the hyperbola, derived here).
    evidence: derived
  - organism: Cyprinus carpio red myotomal muscle, 20 C
    computation: "G = 0.29, v_max = 5.71 L0/s  ->  f_opt = sqrt(0.29^2+0.29) - 0.29 = 0.322;  v_opt = 0.322*5.71 = 1.84 L0/s;  P_max = 0.1035*F0*v_max"
    value: 1.84
    note: >
      DERIVED by us from the measured G and v_max of Rome & Sosnicki (1990, abstract). It is the shortening
      speed at which the steady-state Hill fit predicts peak power; it is not a measured optimum. The same
      paper reports a measured maximal power of 94.3 +- 3.2 W/kg at 20 C. We did not reconcile the two
      because absolute F0 for these bundles was not in the abstract text seen.
    evidence: derived
  - organism: "mouse skeletal muscle in cyclic (work-loop) contraction (muscle identity as given by citing papers: soleus)"
    value_range: [0.075, 0.30]
    note: >
      OBSERVED optimal V/v_max for net power across the cycle conditions tested, maximum net power 94 W/kg
      (Askew & Marsh 1998, as summarised by search results; full text and abstract not read directly). The
      authors report it lies below the force-velocity prediction. Compare the derived 0.20-0.36 above.
    evidence: literature
contested_by:
  - "Meaning of the constant a: Hill (1938) identified a with the heat-of-shortening coefficient; Hill (1964) reported the two are different quantities and attributed the 1938 agreement to a measurement error of about 30 %. Abbott & Wilkie (1953, via Seow 2013) treat the equation as purely empirical; Seow (2013) argues it encodes cross-bridge kinetics. Not reconciled here."
  - "Shape: single hyperbola (Hill 1938) vs double hyperbola with a high-force break (Edman 1988; Devrome & MacIntosh 2007, 2018) vs near-linear relations in multi-joint human tasks and in older single-joint data above about 0.4 F0 (Ralston et al. 1949; Abbott & Wilkie 1953 reanalysed; Alcazar et al. 2019). Recorded as a live disagreement about which form to fit."
  - "Temperature and curvature: in carp red muscle G FELL from 0.49 to 0.29 between 10 and 20 C (Rome & Sosnicki 1990), and in icefish, cod and marlin fast fibres curvature increased with temperature (Johnston & Altringham 1985), yet marlin G was identical at 15 and 25 C (same source, as summarised). Ranatunga (1984, as reported by Seow 2013) found a/F0 INCREASES with temperature in rat EDL and soleus over 10-35 C, the opposite direction. Seow (2013) also states that in some cold-water fish a/F0 is temperature-insensitive. These are different taxa and preparations; the disagreement is preserved, not averaged."
  - "Eccentric force: isolated animal muscle reaches about 1.6-1.8 F0, while human in vivo studies compiled by Alcazar et al. (2019) range from 5 % below isometric (Webber & Kriellaars 1997) to 80 % above (Cook & McDonagh 1995, 27.6 C). Whether the human deficit is neural inhibition or measurement protocol is not settled in the sources read."
