  session''s network policy. Every figure from them here is a search-summary relay of the abstract.'
- 'A measured Froude efficiency for the American eel (a value of 0.87 is in circulation in my memory):
  one web search on 2026-11-04 did not surface any efficiency figure from Tytell & Lauder 2004. No value
  is asserted.'
- 'A primary naval-architecture source for the 0.35-0.5 resistance hump: not searched beyond one general
  web search; only Wikipedia and forum posts were seen.'
