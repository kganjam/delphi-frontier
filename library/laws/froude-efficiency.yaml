id: froude-efficiency
name: Froude propulsive efficiency, and the Froude number of a surface-piercing body
usability: constraining
# THE GATE CHECKS ONE EQUATION. The checked one is the efficiency. The second relation in this entry,
# Fr = U / sqrt(g * L_wl), is declared in `symbols` and rendered in `latex`, but check_laws.py does not
# balance it. It was balanced separately with the same engine (library/swarm_units.py via
# check_laws.eval_side): U / sqrt(g * L_wl) -> dimensionless. That check is recorded here so a reader
# knows it was done and how, not merely asserted.
equation: "eta_F = 2 * U / (U + V_j)"
latex: "\\eta_F = \\frac{2U}{U + V_j} = \\frac{2}{1 + V_j/U}, \\qquad \\mathrm{Fr} = \\frac{U}{\\sqrt{g L_{wl}}}, \\qquad U_{hull} = \\sqrt{\\frac{g L_{wl}}{2\\pi}} \\;\\Leftrightarrow\\; \\mathrm{Fr} = \\frac{1}{\\sqrt{2\\pi}} \\approx 0.40"
symbols:
  eta_F:
    dimension: '1'
    units: dimensionless
    description: Froude (propulsive) efficiency -- useful thrust power T*U divided by the power imparted to the fluid
  U:
    dimension: L/T
    units: m/s
    description: forward speed of the body relative to the undisturbed fluid
  V_j:
    dimension: L/T
    units: m/s
    description: 'mean speed of the jet or wake far downstream, in the body frame (V_j > U for net thrust)'
  Fr:
    dimension: '1'
    units: dimensionless
    description: 'length Froude number U/sqrt(g*L_wl); ratio of inertial to gravitational (wave-making) effects at a free surface'
  g:
    dimension: L/T^2
    units: m/s^2
    description: gravitational acceleration
  L_wl:
    dimension: L
    units: m
    description: 'waterline length of the surface-piercing body (NOT body length for a submerged swimmer, and NOT chest depth)'
constants:
  froude_hull_speed:
    value: 0.399
    interval:
    - 0.35
    - 0.5
    units: dimensionless
    evidence: derived
    note: 'The VALUE is DERIVED, not measured: deep-water gravity waves have wavelength 2*pi*U^2/g, and
      setting that equal to L_wl gives Fr = 1/sqrt(2*pi) = 0.3989. The INTERVAL IS NOT A CONFIDENCE INTERVAL.
      It is the band over which wave-making resistance of displacement hulls is described as rising steeply
      (from about 0.35, continuing to about 0.5), taken from a search-summary of the Wikipedia "Hull speed"
      article and naval-architecture forum posts -- no primary naval-architecture text was retrieved. Those
      same secondary sources say the 0.40 figure "varies with hull form". The imperial form 1.34*sqrt(LWL
      in ft) knots is the same number in different units (1.34 checked by me: sqrt(32.2/2pi)/1.688 = 1.34);
      sources quoting constants up to 1.51 are quoting a different, hull-form-dependent rule of thumb.'
  eider_hull_speed:
    value: 0.732
    interval:
    - 0.686
    - 0.778
    units: m/s
    evidence: literature
    note: 'Gough, Farina & Fish 2015, Somateria mollissima: 0.732 +/- 0.046 m/s (mean +/- s.d., interval
      here is +/- 1 s.d., NOT a CI). This is CALCULATED by the authors from waterline lengths of museum
      specimens, not observed as a speed limit. A 2015 SICB abstract by the same group gives 0.72 +/- 0.05;
      the journal figure is used. My back-calculation: 0.732 m/s at Fr = 0.399 implies L_wl = 0.343 m.'
  eider_steaming_froude:
    value: 2.17
    units: dimensionless
    evidence: literature
    note: 'Gough et al. 2015: steaming eiders averaged 3.99 +/- 1.02 m/s (N = 38), 5.5 times the calculated
      hull speed, which the authors convert to Fr = 2.17. The SPEED is MEASURED (video); the Froude number
      is CALCULATED from it. Paddle-assisted flying reached 6.8 times hull speed. Back-calculation (mine):
      Fr = 2.17 at 3.99 m/s implies L_wl = 0.345 m, consistent with the 0.343 m implied by their hull speed,
      so the authors used the length Froude number defined above. The SICB abstract gives 5.9 times; the
      journal figure is used and the discrepancy is not reconciled.'
  mallard_max_sustained:
    value: 0.71
    units: m/s
    evidence: literature
    note: 'Prange & Schmidt-Nielsen 1970: the maximum SUSTAINABLE swimming speed of mallards "coincided
      with" the hull speed of a displacement ship of the same waterline length, 0.33 m. The 0.71 m/s figure
      is the hull speed as CALCULATED in Aigeldinger & Fish 1995, relayed by search summary; my own
      recalculation from 0.33 m at Fr = 0.399 gives 0.718 m/s. Minimum cost of transport was at 0.50 m/s
      (5.77 kcal/kg/km), i.e. at Fr about 0.28 -- below hull speed. Read from abstracts only.'
  duckling_burst_multiple:
    value: 4.0
    units: dimensionless
    evidence: literature
    note: 'Aigeldinger & Fish 1995 (abstract, via search summary): mallard ducklings, mean maximum burst
      speed 1.73 m/s, "four times greater than the predicted hull speed", achieved by hydroplaning. Gough
      et al. 2015 cite the SAME paper as 2.7 times. NOT RECONCILED -- see contested_by. My inference only:
      4x implies a predicted hull speed of 0.43 m/s and L_wl about 0.12 m; 2.7x implies L_wl about 0.26 m,
      which is close to an adult mallard rather than a duckling, so the 4x reading is the more internally
      consistent one. That is arithmetic on a secondary relay, not a reading of the paper.'
  squid_jet_propulsive_efficiency:
    value: null
    interval:
    - 0.70
    - 0.93
    units: dimensionless
    note: 'NOT ASSERTED AS A SINGLE VALUE. A secondary review (relayed by search summary) attributes 70-93
      per cent jet propulsive efficiency in squid to Anderson & Grosenbaugh 2005 and Bartol et al. 2008,
      2009, and a whole-cycle value of 49 per cent to Anderson & Grosenbaugh 2005 "recalculated from
      Anderson & DeMont 2000". None of these tables was read. These are efficiencies computed from PIV
      wake measurements and models, not directly observed powers.'
  wave_drag_depth_rule:
    value: 3
    interval:
    - 2
    - 3
    units: body diameters
    evidence: literature
    note: 'Depth below which wave drag on a submerged swimmer becomes small: "about 2 to 3 body diameters"
      (Stokes et al. 2024 PNAS, abstract and press summaries), a theoretical prediction attributed to towing
      experiments by Hertel (1966), which was NOT retrieved. A figure of "surface drag about 5 times the
      drag at three body diameters" was seen only as a truncated fragment in a secondary paper and is NOT
      asserted. Stokes et al. report that non-foraging air-breathing animals from little penguins to pygmy
      blue whales travel at about this depth (observation, from tags, per the abstract).'
  human_swimmer_streamline_depth:
    value: null
    note: 'Vennell, Pease & Wilson 2006 (abstract, via search summary), towed mannequin: wave drag below
      5 per cent of total for tows deeper than 0.5 m at 1 m/s and 0.7 m at 2 m/s; total drag AT THE SURFACE
      up to 2.4 times fully-immersed drag; streamline deeper than 1.8 chest depths at Fr = 0.2 and 2.8
      chest depths at Fr = 0.42. These are MEASURED on a mannequin, not a swimming human. Their Fr uses
      a 2.34 m toe-to-fingertip length (my check: 0.9 and 2.0 m/s give Fr = 0.19 and 0.42).'
mechanism: 'TWO MECHANISMS, kept separate because they fail separately.

  (1) FROUDE EFFICIENCY is actuator-disc momentum theory. Thrust is the rate of momentum added to the
  fluid, T = mdot*(V_j - U); the kinetic energy left in the wake is 0.5*mdot*(V_j - U)^2 per unit time
  in the fluid frame. Useful power T*U over useful-plus-wasted gives 2U/(U + V_j). For a FIXED thrust,
  efficiency therefore favours accelerating a large mass of fluid a little rather than a small mass a lot.
  The algebra is exact; the theory it sits in (steady, uniform, inviscid, a well-defined far wake) is the
  approximation.

  (2) THE FROUDE NUMBER of a surface-piercing body measures how fast it moves relative to the waves it
  makes. A body at the surface generates a gravity-wave system whose wavelength grows as U^2. When that
  wavelength reaches the waterline length (Fr = 1/sqrt(2*pi), about 0.40) the bow wave and stern wave
  reinforce, the body sits in a trough of its own making, and wave-making resistance rises steeply.
  This is a power-cost barrier, not a speed ceiling: a body that can pay the power, or that generates
  enough dynamic lift to climb out of its own wave (planing), passes through it.

  THE LINK between the two: a surface-limited animal that pushes harder near hull speed gains little speed,
  so it must raise V_j for little gain in U, and eta_F falls. The link is my inference from the two
  formulas, not a claim taken from any source read here.

  '
domain_of_validity:
  flow: 'steady, quasi-one-dimensional momentum exchange with a well-defined far wake (for eta_F); a
    displacement-mode body piercing a free surface in deep water (for the hull-speed Froude number)'
  water_depth: 'deep relative to wavelength; in shallow water the wave speed is sqrt(g*h) and a different
    (depth) Froude number governs'
  notes: 'eta_F applies to a continuously acting propulsor. Eloy 2012''s more general definition,
    eta = D*U / (D*U + mean shed power), reduces to it in the steady case and is what is used for undulatory
    swimmers. The hull-speed Froude number applies only while the body is AT the surface: below about 2-3
    body diameters it stops governing (see wave_drag_depth_rule).

    '
where_it_breaks: 'Hull speed is not a speed limit for an animal that can plane -- eiders steam at Fr 2.17,
  five times past it -- and the Froude efficiency formula is wrong in both directions for a jetting squid.

  FROUDE EFFICIENCY. (a) PULSED JETS: Anderson & DeMont 2000 derived squid-specific jet
  and whole-cycle efficiency equations and report (abstract) that the Froude equation UNDERESTIMATES jet-period
  efficiency and OVERESTIMATES whole-cycle efficiency in Loligo pealei -- it is wrong in BOTH directions
  for the same animal, depending on whether the refill phase is counted, and the refill phase is where
  most of the loss sits. So for a jetting design, quoting eta_F without stating which period it covers is
  meaningless. (b) VORTEX-RING FORMATION: Krueger & Gharib 2003 measured (piston-cylinder, force balance)
  that a starting jet with vortex-ring formation carries more impulse than the jet velocity alone predicts,
  attributed to nozzle over-pressure; the steady formula therefore misprices pulsed propulsion. Their
  result is a gain RELATIVE TO A STEADY JET of matched parameters; I have NOT found that it beats the
  momentum-theory bound itself, and the earlier version of this entry, which said it did, had no source
  for that and is withdrawn. (c) eta_F prices thrust but does not supply it: eta_F -> 1 as V_j -> U, where
  thrust -> 0, so a high eta_F is not a sign of a working propulsor. (d) It is blind to viscous and profile
  losses on the propulsor and to the body''s drag, so it is an UPPER BOUND on one term of the budget,
  never a system or metabolic efficiency.

  HULL-SPEED FROUDE NUMBER. (e) IT IS NOT A SPEED LIMIT FOR ANIMALS THAT CAN PLANE. Measured: mallard
  ducklings burst to about four times predicted hull speed by hydroplaning (Aigeldinger & Fish 1995);
  common eiders steam at 5.5 times hull speed, Fr = 2.17, and paddle-assisted flying reaches 6.8 times
  (Gough et al. 2015). The 0.40 barrier holds for SUSTAINED DISPLACEMENT swimming (adult mallards, Prange
  & Schmidt-Nielsen 1970) and fails for burst planing. (f) IT STOPS APPLYING UNDERWATER: below roughly
  2-3 body diameters wave drag becomes small (Stokes et al. 2024; Vennell et al. 2006 measured under
  5 per cent of total drag below 0.5-0.7 m on a mannequin), so a fully submerged swimmer is not
  hull-speed limited at all -- the length that matters for wave drag then becomes DEPTH relative to body
  thickness, not waterline length. (g) THE 0.40 IS A HUMP, NOT A WALL: secondary naval-architecture sources
  put the steep rise from about Fr 0.35 to 0.5 and say it varies with hull form; long, slender hulls are
  routinely driven beyond it with enough power. A design check of "U < 0.40 sqrt(g L)" is therefore a
  check on POWER COST, and a hard speed claim made from it is an error. (h) SHALLOW WATER changes the
  governing wave speed to sqrt(g*h) and the length Froude number above is then the wrong group.

  '
worked_examples:
- organism: generic propulsor, three jet-speed ratios
  computation: "V_j = 1.5*U : eta_F = 2/(1 + 1.5) = 0.800\nV_j = 2.0*U : eta_F = 2/(1 + 2.0) = 0.667\n\
    V_j = 3.0*U : eta_F = 2/(1 + 3.0) = 0.500"
  value: 0.8
  note: 'CORRECTED from the previous version of this entry, after challenge 46. The excess jet speed is
    V_j - U. Going from 1.5U to 3.0U QUADRUPLES the excess (0.5U to 2.0U) and costs 30 points; DOUBLING
    the excess (0.5U to 1.0U) costs 13.3 points. All three numbers are calculated from the formula, not
    measured.'
  evidence: derived
- organism: Anas platyrhynchos, adult, waterline length 0.33 m
  computation: 'U_hull = sqrt(9.81 * 0.33 / (2*pi)) = 0.718 m/s  (Fr = 0.399)

    minimum cost of transport at 0.50 m/s  ->  Fr = 0.50 / sqrt(9.81*0.33) = 0.28'
  value: 0.718
  note: 'Calculated by me from the published waterline length. Prange & Schmidt-Nielsen OBSERVED that the
    maximum sustainable speed coincided with this limit (abstract). The check passes for sustained
    displacement swimming.'
  evidence: derived
- organism: Somateria mollissima (common eider), steaming
  computation: 'L_wl implied by published hull speed: 2*pi*0.732^2/9.81 = 0.343 m

    Fr at measured steaming speed: 3.99 / sqrt(9.81 * 0.345) = 2.17  (published value)'
  value: 2.17
  note: 'The published Fr is reproduced from the published speed, so the definition used here matches the
    authors''. This is the counterexample to treating 0.40 as a ceiling: the measured speed is 5.5 times
    the calculated hull speed.'
  evidence: literature
- organism: Danio rerio-scale surface-piercing body, waterline length 0.03 m (hypothetical design)
  computation: 'U_hull = sqrt(9.81 * 0.03 / (2*pi)) = 0.216 m/s  (about 7 body lengths per second)'
  value: 0.216
  note: 'Calculated, not observed. A 3 cm body swimming AT the surface and asked to sustain more than about
    0.2 m/s in displacement mode is paying the wave-drag hump; the same body two to three body depths down
    is not. This is the number a design can be checked against, and the where_it_breaks section says when
    the check stops applying. Zebrafish are not surface swimmers; the scale is chosen only to put the
    library''s recurring design case on this law.'
  evidence: derived
- organism: Homo sapiens, towed mannequin, 2.34 m toe-to-fingertip length
  computation: 'U_hull = sqrt(9.81 * 2.34 / (2*pi)) = 1.91 m/s

    Vennell et al. speeds 0.9 and 2.0 m/s  ->  Fr = 0.19 and 0.42'
  value: 1.91
  note: 'Calculated by me. Vennell et al.''s upper test speed, 2.0 m/s, sits at Fr = 0.42 -- at the hump --
    which is consistent with their measured surface drag of up to 2.4 times submerged drag. That
    consistency is my inference; the paper (abstract only) does not frame it as hull speed. Whether elite
    surface swimmers are hull-speed limited was NOT searched and is not claimed.'
  evidence: derived
contested_by:
- 'DUCKLING BURST MULTIPLE: Aigeldinger & Fish 1995 (abstract) give four times predicted hull speed; Gough,
  Farina & Fish 2015 cite the same paper as 2.7 times. Both relayed by search summary; neither full text
  was read. Not reconciled.'
- 'EIDER MULTIPLE: Gough et al. 2015 (journal) give 5.5 times hull speed for steaming; the same group''s
  2015 SICB abstract gives 5.9 times and a hull speed of 0.72 +/- 0.05 m/s. Not reconciled; the journal
  figures are used in constants.'
- 'PULSED-JET THRUST AUGMENTATION: Krueger & Gharib report large impulse gains from vortex-ring formation
  (later fully-pulsed-jet work: up to 90 per cent augmentation as duty cycle approaches 1, per search
  summary). A 2021 arXiv paper states its findings contradict Krueger & Gharib 2003 and reports lower
  augmentation; another critic attributes the gap partly to a Reynolds number an order of magnitude higher.
  Seen only as search summaries; the arXiv paper''s authors were not retrieved, so it is not listed as a
  source. Not reconciled.'
- 'SHARE OF WAVE DRAG IN HUMAN SWIMMING near 2 m/s: about 5 per cent (Vorontsov & Rumyantsev 2000), 21 per
  cent (Toussaint et al. 2002), up to 60 per cent (Vennell et al. 2006), as tabulated in a Southampton thesis
  seen by search summary. The definitions differ (active versus passive, depth) and are not reconciled.'
- 'Not contested as mathematics. What is contested in biology is whether a given wake is steady enough
  for eta_F to apply; see the lighthill entry for the undulatory case, where shed power is computed rather
  than assumed.'
