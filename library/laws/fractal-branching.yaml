    read_level: full-text-preprint
    note: "arXiv 1105.2591 converted with pdftotext; the passages on eq. 2, eq. 9, Figs. 2 and 4, the 'never been measured' statement and the closing assumption were read in context. Not read end to end."
  - citation: "Malcai O, Lidar DA, Biham O, Avnir D (1997) Phys Rev E 56:2817-2828, Scaling range and cutoffs in empirical fractals, doi 10.1103/PhysRevE.56.2817"
    read_level: full-text-preprint
    note: "arXiv cond-mat/9801127; abstract and survey section read. The survey covers physics papers, not organisms."
  - citation: "Seidel D (2018) Ecology and Evolution 8(1):128-134, A holistic approach to determine tree structural complexity based on laser scanning data and fractal analysis, doi 10.1002/ece3.3661"
    read_level: full-text
    note: "PMC5756834 XML via NCBI eutils; methods, Fig. 1 caption and discussion passages quoted here were read. Box-plot values not digitised."
  - citation: "Bentley LP, Stegen JC, Savage VM, Smith DD, von Allmen EI, Sperry JS et al. (2013) Ecology Letters 16:1069-1078, An empirical assessment of tree branching networks and implications for plant allometric scaling models, doi 10.1111/ele.12127"
    read_level: abstract
  - citation: "Halley JM, Hartley S, Kallimanis AS, Kunin WE, Lennon JJ, Sgardelis SP (2004) Ecology Letters 7:254-271, Uses and abuses of fractal methodology in ecology, doi 10.1111/j.1461-0248.2004.00568.x"
    read_level: abstract
  - citation: "Engleman A, Cox K, Brooke S (2023) PeerJ 11:e16101, Dead but not forgotten: complexity of Acropora palmata colonies increases with greater composition of dead coral, doi 10.7717/peerj.16101"
    read_level: abstract
    note: "Abstract via Crossref. peerj.com full text refused by this session's egress proxy (403), so no numeric D values were taken."
  - citation: "Kaandorp JA, Sloot PMA, Merks RMH, Bak RPM, Vermeij MJA, Maier C (2005) Proc R Soc B 272:127-133, Morphogenesis of the branching reef coral Madracis mirabilis, doi 10.1098/rspb.2004.2934"
    read_level: abstract
  - citation: "Bradbury RH, Reichelt RE (1983) Mar Ecol Prog Ser 10:169-171, Fractal dimension of a coral reef at ecological scales, doi 10.3354/meps010169"
    read_level: search-summary
    note: "Crossref record has no abstract; int-res.com PDF refused by this session's egress proxy (403). The D = 1.9-2.0 value comes from a search-engine summary only."
  - citation: "Bradbury RH, Reichelt RE, Green DG (1984) Mar Ecol Prog Ser 14:295-296, Fractals in ecology: methods and interpretation, doi 10.3354/meps014295"
    read_level: search-summary
    note: "Same access failure as the 1983 paper. The 'very smooth at colony scale' conclusion comes from a search-engine summary only."
  - citation: "Zawada KJA, Dornelas M, Madin JS (2019) Coral Reefs 38:1281-1292, Quantifying coral morphology, doi 10.1007/s00338-019-01842-4"
    read_level: abstract
    note: "Preprint abstract (bioRxiv 10.1101/553453) via Europe PMC: 152 laser scans, seven growth forms. The abstract does not state whether fractal dimension was among the six shape variables; bioRxiv returned 429 and the St Andrews repository copy was refused (403). This is the search behind finding (6) in where_it_breaks: one web search plus these three retrieval attempts, no colony-branching D found."
  - citation: "Zeide B (1993) Ecology 74:1598"
    read_level: listing
    note: "Seen only in Eloy (2011)'s reference list as the source of the 2.2-2.8 foliage interval. Title, method and data not retrieved."
