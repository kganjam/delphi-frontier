search_scope: >
  Searched 2026-11-04 through web search (about 10 queries), Europe PMC REST (title and full-text
  queries), and direct fetches of PMC, arXiv and journal pages. These hosts were unreachable from
  this session: J-STAGE, AIAA (arc.aiaa.org), the JEB PDF host (cob.silverchair.com), Whiterose
  eprints, NASA rotorcraft, OpenAlex, Semantic Scholar and MDPI. Every negative statement in this
  entry ("unknown", "no data found") is limited to that scope.
