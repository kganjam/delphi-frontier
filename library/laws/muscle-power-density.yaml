  - citation: "Seow CY (2013) Hill's equation of muscle performance and its hidden insight on molecular mechanisms. J Gen Physiol 142(6):561"
    read_level: search-summary
    note: "Used for: power peaks near 0.3 F_0; Hill fit good over ~0.05-0.8 F_0. The eta values in constants are my own calculation from Hill's form, not from this source."
search_scope: >
  Four standard web searches plus four follow-ups (2026-11-04). Direct fetch of journals.biologists /
  silverchair full text failed (host not reachable from this session), so NO source was read in full;
  every value is from search-engine summaries of abstracts or citing papers. Galago and other mammal
  jump values, toadfish swimbladder and hummingbird values were not searched and are absent, not
  negative.
