    read_level: search-summary
  - citation: "McMahon TA (1975) Allometry and biomechanics: limb bones in adult ungulates. American Naturalist 109:547-563"
    read_level: listing
  - citation: "Alexander RMcN, Jayes AS, Maloiy GMO, Wathuta EM (1979) Allometry of the limb bones of mammals from shrews (Sorex) to elephant (Loxodonta). J Zool Lond 189:305-314"
    read_level: search-summary
    note: "Exponents 0.35/0.36 seen only in a secondary student flashcard source; not verified against the paper."
  - citation: "Biewener AA (1989) Scaling body support in mammals: limb posture and muscle mechanics. Science 245:45-48"
    read_level: abstract
  - citation: "Biewener AA (2005) Biomechanical consequences of scaling. J Exp Biol 208(9):1665-1676"
    read_level: could-not-access
    note: "Host blocked by this session's network policy; its content reached me only through search summaries."
  - citation: "Bertram JEA, Biewener AA (1990) Differential scaling of the long bones in the terrestrial Carnivora and other mammals. J Morphol 204:157-169"
    read_level: search-summary
    note: "Search confirmed only author/year as cited by a review; journal, volume and pages are from my recall and were not verified."
  - citation: "Christiansen P (1999a) Scaling of the limb long bones to body mass in terrestrial mammals. J Morphol 239:167-190"
    read_level: listing
  - citation: "Christiansen P (1999b) Scaling of mammalian long bones: small and large mammals compared. J Zool"
    read_level: search-summary
