    read_level: abstract
    note: "Abstract via Crossref API, returned through a summarising fetch tool, not read verbatim. Full text not accessed; whether the paper gives the explicit self-weight cantilever prefactor is not verified -- C_s = 2 is my own calculation."
  - citation: "McMahon TA (1975) Allometry and biomechanics: limb bones in adult ungulates. Am. Nat. 109(969):547-563. doi:10.1086/283026"
    read_level: listing
    note: "Crossref metadata only, no abstract returned. Family exponents (0.52 Suidae etc.) are second-hand via the sibling entry."
  - citation: "Alexander RMcN, Jayes AS, Maloiy GMO, Wathuta EM (1979) Allometry of the limb bones of mammals from shrews (Sorex) to elephant (Loxodonta). J. Zool. 189(3):305-314. doi:10.1111/j.1469-7998.1979.tb03964.x"
    read_level: abstract
    note: "Via Crossref API through a summarising fetch."
  - citation: "Biewener AA (1983) Allometry of quadrupedal locomotion: the scaling of duty factor, bone curvature and limb orientation to body size. J. Exp. Biol. 105:147-171. doi:10.1242/jeb.105.1.147"
    read_level: abstract
    note: "Via Crossref API through a summarising fetch."
  - citation: "Dawson SD (1994) Allometry of cetacean forelimb bones. J. Morphol. 222(2):215-221. doi:10.1002/jmor.1052220208"
    read_level: abstract
    note: "Via Crossref API; abstract gives no numeric exponents."
  - citation: "Sullivan TN, Meyers MA, Arzt E (2019) Scaling of bird wings and feathers for efficient flight. Sci. Adv. 5(1):eaat4269. doi:10.1126/sciadv.aat4269 (PMC6357743)"
    read_level: full-text
    note: "Europe PMC full-text XML, but read through a summarising fetch that answered targeted questions, not end to end. escholarship.org copy did not resolve from this session."
  - citation: "Sibling law entries elastic-similarity.yaml and greenhill.yaml, branch origin/work/law-library, commit 39c42d30"
    read_level: full-text
    note: "Read in full for consistency; not re-verified source by source."
