    read_level: abstract
search_scope: >
  Five web searches and two fetch attempts on 2026-11-04 (one fetch, of the JEB review, blocked by
  the network policy). No primary paper was read in full. Exponent values for McMahon (1975) bovid
  data, and the identity of the Barro Colorado tree study, were not found within that scope and are
  recorded as unknown.
