    read_level: could-not-access
    note: The historical primary papers were not searched for; the citation is from memory and its page numbers are flagged unverified.
  - citation: "Murray CD (1926) The physiological principle of minimum work. PNAS 12(3):207-214"
    read_level: search-summary
    note: Same read level as in murray.yaml; not re-read here.
