    read_level: search-summary
    note: Re_c of about 2040 (+/-10) is from search summaries of the supplementary material and a conference abstract. research-explorer.ista.ac.at was outside the session network allowlist.
  - citation: "Mukund V, Hof B (2017) The critical point of the transition to turbulence in pipe flow. arXiv:1709.06372"
    read_level: search-summary
