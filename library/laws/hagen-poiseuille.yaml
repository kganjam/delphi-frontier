    read_level: abstract
    note: "Retrieved via Europe PMC by DOI. The abstract gives no numeric diameter for the viscosity minimum."
  - citation: "Pries AR, Secomb TW (2005) Microvascular blood viscosity in vivo and the endothelial surface layer. Am J Physiol Heart Circ Physiol 289(6):H2657-H2664. doi:10.1152/ajpheart.00297.2005. PMID 16040719"
    read_level: abstract
  - citation: "Reneman RS, Hoeks APG (2008) Wall shear stress as measured in vivo: consequences for the design of the arterial system. Med Biol Eng Comput 46(5):499-507. doi:10.1007/s11517-008-0330-2. PMC2441533"
    read_level: full-text
    note: "Read on PMC. Contains no Womersley number; the alpha in the aorta example is my calculation."
  - citation: "Avila K, Moxey D, de Lozar A, Avila M, Barkley D, Hof B (2011) The onset of turbulence in pipe flow. Science 333(6039):192-196. doi:10.1126/science.1203223"
    read_level: abstract
  - citation: "Sherman TF (1981) On connecting large vessels to small: the meaning of Murray's law. J Gen Physiol 78(4):431-453. doi:10.1085/jgp.78.4.431. PMC2228620"
    read_level: abstract
    note: "Abstract states the cube law and that a functional relation follows between radius, flow, velocity profile, wall shear and Re; the PDF body was not read."
  - citation: "Womersley JR (1955) Method for the calculation of velocity, rate of flow and viscous drag in arteries when the pressure gradient is known. J Physiol 127(3):553-563. doi:10.1113/jphysiol.1955.sp005276. PMC1365740"
    read_level: listing
    note: "Bibliographic record confirmed by search; content not retrieved. Cited only as the origin of the alpha parameter."
  - citation: "Uylings HBM (1977) Bull Math Biol -- optimisation of diameters and bifurcation angles in lung and vascular trees (exact title, volume and pages not verified)"
    read_level: could-not-access
    note: "Europe PMC query (author Uylings, 1977, turbulent OR branching) returned 0 hits; the 7/3 turbulent claim is known to me only from secondary citations (arXiv 1501.03546; Front Physiol 2022 10.3389/fphys.2022.871912), seen as search snippets."
  - citation: "Murray CD (1926) The physiological principle of minimum work. PNAS 12(3):207-214"
    read_level: search-summary
    note: "Cited through murray.yaml; not re-read for this entry."
