    read_level: listing
    note: The bibliographic record was confirmed. Its content (the alpha regimes) comes from secondary summaries, not from the paper.
  - citation: "Pries AR, Neuhaus D, Gaehtgens P (1992) Blood viscosity in tube flow: dependence on diameter and hematocrit. Am J Physiol 263:H1770-H1778"
    read_level: search-summary
    note: The empirical fit equations and their constants were not read; that is why no Fahraeus-Lindqvist numbers are given.
  - citation: "Sperry JS, Hacke UG, Wheeler JK (2005) Comparative analysis of end wall resistivity in xylem conduits. Plant Cell Environ (volume and pages not verified)"
    read_level: search-summary
    note: The PDF host sperry.biology.utah.edu was outside the session network allowlist.
  - citation: "Uylings HBM (1977) Optimization of diameters and bifurcation angles in lung and vascular tree structures. Bull Math Biol 39(5):509-520. doi:10.1007/BF02461198"
    read_level: listing
    note: Not read. The 'as low as 2.33' turbulent exponent is as reported by Jessen et al. (2023).
  - citation: "Jessen E, Steinbach MC, Debbaut C, Schillinger D (2023) Branching exponents of synthetic vascular trees under different optimality principles. arXiv:2304.11998"
    read_level: full-text
    note: The PDF was text-extracted and searched for the passages used (the Uylings turbulent-exponent statement and the synthetic-tree exponents of about 2.7-3.0). It was not read cover to cover.
  - citation: "Conference abstract: Do xylem vessels of a liana species behave like ideal capillaries? ESA 2012, PS 49-93 (authors not recorded)"
    read_level: search-summary
    note: The source of the Humulus 41% (SD 9%) figure. It is preliminary and not peer reviewed.
