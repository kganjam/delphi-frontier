search_scope: >
  Searches run Nov 2026 via a general web search tool and PMC/eLife fetches: Swinton sunflower citizen
  science; Besnard 2014 AHP6; Douady-Couder 1992/1996; Vogel 1979; King/Beck/Lüttge light capture;
  Jean cross-species survey figures; Reinhardt 2003; Turner 2023 Asteroxylon; Strauss 2020; Okabe 2015;
  Smith 2006. Not searched: mechanical-buckling accounts of phyllotaxis (Green, Newell & Shipman),
  Adler's contact-pressure model, and measured divergence-angle distributions in conifers or cacti. All
  negative findings above ("unknown", "not located") are bounded by this scope.
