search_scope: >
  Searches and fetches run 2026-11-04 with a general web search tool and PMC/eLife/arXiv fetches:
  Landrein 2015, Swinton 2016, Smith 2006, Refahi 2016, Okabe 2015 (both papers), Turner 2023, Strauss 2020,
  Besnard 2014, Douady & Couder 1992, mechanical/buckling phyllotaxis (one search). Hosts that refused:
  pure.ed.ac.uk, pbsociety.org.pl (outside allowlist), nature.com (login redirect). NOT searched: measured
  divergence-angle distributions in conifers, cacti or other non-model taxa; Adler's contact-pressure model;
  Green's biophysical work; the King, Beck & Luttge and Valladares & Brites light-capture papers cited by an
  earlier draft. Every "unknown" or "not found" above is bounded by this scope.
prior_draft: >
  An earlier, unmerged draft of this entry exists at commit 79960f11 on branch
  claude/phyllotaxis-golden-angle-law-upiubr and was reviewed in challenge 62. This entry was written
  independently but incorporates that review's corrections: it records Landrein's observed Col-0 mean of
  136 deg, gives the permutation signature as 275.0/222.5 deg, and does not put two growth conditions into
  an `interval` field.
