  - citation: "Park H, Choi H (2010) Aerodynamic characteristics of flying fish in gliding flight. J Exp Biol 213:3269-3279. doi:10.1242/jeb.046052"
    read_level: abstract
  - citation: "Bahlman JW, Swartz SM, Riskin DK, Breuer KS (2013) Glide performance and aerodynamics of non-equilibrium glides in northern flying squirrels (Glaucomys sabrinus). J R Soc Interface. doi:10.1098/rsif.2012.0794"
    read_level: abstract
  - citation: "Vernes K (2001) Gliding performance of the northern flying squirrel (Glaucomys sabrinus) in mature mixed forest of eastern Canada. J Mammal 82(4):1026-1033. doi:10.1644/1545-1542(2001)082<1026:GPOTNF>2.0.CO;2"
    read_level: search-summary
  - citation: "Yeaton IJ, Socha JJ, Ross SD (2017). Title and venue unknown: seen only as a PDF hit (rossaoe.s4.es.cloud.vt.edu/papers/yeaton-socha-ross-2017.pdf) with a search-summary of its content"
    read_level: search-summary
