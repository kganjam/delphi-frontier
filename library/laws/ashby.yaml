id: ashby
name: Ashby material-selection indices
usability: constraining
equation: "P_beam = E^(1/2) / rho"
latex: "P_{\\text{tie}} = \\frac{E}{\\rho}, \\quad P_{\\text{beam}} = \\frac{E^{1/2}}{\\rho}, \\quad P_{\\text{panel}} = \\frac{E^{1/3}}{\\rho}, \\quad P_{\\text{strong beam}} = \\frac{\\sigma_f^{2/3}}{\\rho}"
symbols:
  P_beam: {dimension: M^-1/2*L^5/2/T, units: "Pa^(1/2) m^3 kg^-1", description: "the performance index for a light, stiff beam; its ODD dimension is expected and is explained in the mechanism"}
  E:      {dimension: M/(L*T^2), units: Pa, description: "Young's modulus"}
  rho:    {dimension: M/L^3, units: kg/m^3, description: "density"}
  sigma_f: {dimension: M/(L*T^2), units: Pa, description: "failure strength, used by the strength indices"}
constants:
  tie_exponent:
    value: 1.0
    note: "DERIVED, exact: a light stiff tie in tension maximises E/rho. The section is fixed by the load, so modulus enters linearly."
  beam_exponent:
    value: 0.5
    note: >
      DERIVED, exact. Stiffness requires E*I = E*d^4/12 >= S*L^3, so d goes as (S*L^3/E)^(1/4), and
      mass m = rho*d^2*L goes as rho*E^(-1/2). Minimising mass means maximising E^(1/2)/rho.
  panel_exponent:
    value: 0.3333
    note: "DERIVED, exact: for a plate or panel of fixed width the free variable is thickness, and the index becomes E^(1/3)/rho."
  strong_beam_exponent:
    value: 0.6667
    note: "DERIVED, exact: the strength-limited counterpart of the stiffness beam index."
  biological_property_values:
    value: null
    note: >
      NO SOURCED E, rho OR sigma_f FOR BONE, WOOD, CHITIN, KERATIN OR SILK WAS RETRIEVED in this
      compilation. The method is exact and the arithmetic trivial; the missing INPUTS, not the
      method, are what stop this entry carrying a biological worked example. Ashby et al. 1995
      conclude that many natural materials are superior to the man-made materials of engineering,
      but no property values were retrieved to show it.
mechanism: >
  Write the mass of a component that meets a stiffness or strength target, then eliminate the free
  geometric variable. The material properties separate out as a single group, and that group is the
  index: maximise it and the component is lightest. The index has an odd physical dimension --
  E^(1/2)/rho is not a familiar quantity -- and that is expected rather than a mistake, because an
  index is a RANKING FUNCTION, not a measurable property. Only comparisons between materials are
  meaningful; the absolute value has no interpretation. On log-log property axes a line of constant
  index has slope 1, 2 or 3 depending on the loading mode, which is what makes the charts readable
  at a glance.
domain_of_validity:
  loading: "one dominant loading mode at a time -- tie, beam, panel, column"
  geometry: "the named free variable can scale without other constraints"
  notes: >
    Each index is derived for ONE objective (minimum mass) under ONE constraint (a stiffness or
    strength target). A component serving two structural functions at once has no single index.
where_it_breaks: >
  The indices assume one property per material, and biological materials are anisotropic,
  hierarchical and hydrated, so a single E is a simplification that can be wrong by a large factor
  depending on direction and water content -- wood along and across the grain is the obvious case.
  They also assume the shape can scale freely, which organisms cannot do: growth constrains the
  path to a shape as well as the shape, and a part usually serves several functions at once. Conifer
  xylem is the clean example and it comes from another entry in this library -- the same conduits
  carry water AND mechanical load, which is exactly why Murray's law is rejected for them, and for
  the same reason no single Ashby index describes them. Finally, minimum MASS is only sometimes the
  objective evolution is working on; minimum metabolic cost of construction and maintenance, or
  resistance to damage, can select differently, and the index is silent on all of those.
worked_examples:
  - organism: "why a beam index is E^(1/2)/rho and not E/rho -- the derivation in full"
    computation: |
      stiffness target : E*I = E*d^4/12 >= S*L^3
      free variable    : d  ->  d proportional to (S*L^3/E)^(1/4)
      mass             : m = rho*d^2*L  proportional to  rho * (S*L^3/E)^(1/2) * L
                            ->  m proportional to rho * E^(-1/2)
      minimise m       ->  maximise E^(1/2)/rho
    note: >
      The exponent comes from eliminating d, not from data, which is why the index is exact. Using
      E/rho (the TIE index) for a beam is the standard error and it changes the ranking: a material
      twice as stiff and twice as dense is equal on E/rho but WORSE on E^(1/2)/rho.
    evidence: derived
  - organism: "the ranking error made concrete"
    computation: |
      material A: E = 10 GPa, rho = 1000       -> E/rho = 1.0e7   E^0.5/rho = 3.16e-3
      material B: E = 20 GPa, rho = 2000       -> E/rho = 1.0e7   E^0.5/rho = 2.24e-3
      tie index  : A and B tie exactly
      beam index : A beats B by a factor 1.41
    value: 1.41
    note: >
      Illustrative round numbers, not any real material. Shown because it demonstrates that
      choosing the wrong index is not a small error of degree -- it can reverse or erase a
      difference entirely.
    evidence: derived
contested_by:
  - "Not contested as method. What is unresolved here is empirical: Ashby et al. 1995 and Wegst & Ashby 2004 compiled the biological property values this entry would need, and neither was retrieved beyond abstract and metadata level, so the charts cannot be populated from this library yet."
sources:
  - citation: "Ashby MF (1989) Acta Metall 37:1273-1293, Overview No. 80: On the engineering properties of materials, doi 10.1016/0001-6160(89)90158-2"
    read_level: metadata
  - citation: "Ashby MF (1989) Mater Sci Technol 5:517-525, Materials selection in conceptual design, doi 10.1179/mst.1989.5.6.517"
    read_level: metadata
  - citation: "Ashby MF, Gibson LJ, Wegst U, Olive R (1995) Proc R Soc A 450:123-140, The mechanical properties of natural materials I: material property charts, doi 10.1098/rspa.1995.0075"
    read_level: abstract
  - citation: "Wegst UGK, Ashby MF (2004) Phil Mag 84:2167-2186, The mechanical efficiency of natural materials, doi 10.1080/14786430410001680935"
    read_level: metadata
