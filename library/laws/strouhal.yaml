    read_level: full-text
    note: Read from PMC (PMC4614456) through an automated summarising fetch; the St equation is an image and was not read directly, the peak-to-peak convention is from the surrounding text.
  - citation: "Gazzola M, Argentina M, Mahadevan L (2014) Scaling macroscopic aquatic locomotion. Nature Physics 10:758-761"
    read_level: search-summary
