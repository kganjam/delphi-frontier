    read_level: search-summary
    note: >
      Simulation, not observation. The snippet seen states that propulsive efficiency at the optimal St
      increases with Re while required power decreases with Re. Volume and first page are from a
      search-result URL; the full title and end page were not verified in this session.
  - citation: "Landmarks and Frontiers in Biological Fluid Dynamics, arXiv:1904.13013"
    read_level: search-summary
